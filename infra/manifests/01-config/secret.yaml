apiVersion: v1
kind: Secret
metadata:
  name: car-repair-shop-secrets
  namespace: ${namespace}
type: Opaque
stringData:
  # SQL Server SA password -- must meet SQL Server complexity requirements
  # (min 8 chars, upper, lower, digit and special character)
  SA_PASSWORD: "${sa_password}"

  # JWT secret key -- minimum 32 characters
  JWT_SECRET_KEY: "${jwt_secret_key}"

  # Connection string for the API -- Password value must match SA_PASSWORD above
  ConnectionStrings__DefaultConnection: "Server=mssql;Database=CarRepairShopDb;User Id=sa;Password=${sa_password};TrustServerCertificate=True;"

  # SMTP credentials
  SmtpSettings__Username: "${smtp_username}"
  SmtpSettings__Password: "${smtp_password}"
