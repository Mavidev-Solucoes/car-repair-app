apiVersion: v1
kind: ConfigMap
metadata:
  name: car-repair-shop-config
  namespace: ${namespace}
data:
  # ASP.NET Core
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_HTTP_PORTS: "8080"

  # JWT (non-sensitive fields only; SecretKey lives in the Secret)
  JwtSettings__Issuer: "${jwt_issuer}"
  JwtSettings__Audience: "${jwt_audience}"
  JwtSettings__ExpirationMinutes: "${jwt_expiration_minutes}"

  # Application
  AppSettings__BaseUrl: "${app_base_url}"

  # SMTP (non-sensitive fields; credentials live in the Secret)
  SmtpSettings__Host: "${smtp_host}"
  SmtpSettings__Port: "${smtp_port}"
  SmtpSettings__UseSsl: "${smtp_use_ssl}"
  SmtpSettings__FromEmail: "${smtp_from_email}"
  SmtpSettings__FromName: "${smtp_from_name}"

  # SQL Server (used by the mssql StatefulSet)
  ACCEPT_EULA: "Y"
  MSSQL_PID: "Developer"
