name: CI – Build, Test & Terraform Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build, Unit Tests & Code Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests with coverage
        run: |
          dotnet test tests/CarRepairShop.UnitTests/CarRepairShop.UnitTests.csproj \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=unit-tests.trx" \
            --results-directory ./TestResults \
            --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: |
          reportgenerator \
            -reports:"./TestResults/**/coverage.cobertura.xml" \
            -targetdir:"./TestResults/CoverageReport" \
            -reporttypes:"Html;Cobertura;MarkdownSummaryGithub"

      - name: Publish coverage summary to GitHub Actions summary
        run: cat ./TestResults/CoverageReport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./TestResults/*.trx

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ./TestResults/CoverageReport/

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Tests
          path: ./TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: true

  integration-tests:
    name: Integration Tests (SQL Server)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run integration tests
        run: |
          dotnet test tests/CarRepairShop.IntegrationTests/CarRepairShop.IntegrationTests.csproj \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=integration-tests.trx" \
            --results-directory ./TestResults \
            -- xunit.parallelizeAssembly=false

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: ./TestResults/*.trx

      - name: Publish integration test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Integration Tests
          path: ./TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: true

  # ─── CD — Build Image & Deploy via Terraform/kubectl_manifest ────────────────
  # Builds the Docker image locally, creates a temporary kind cluster in the
  # GitHub-hosted VM, runs terraform apply (kubectl_manifest resources) and then
  # destroys everything — simulating a full CD pipeline on each push.
  cd-deploy:
    name: CD – Deploy to kind cluster (Terraform)
    needs: [build-and-test, integration-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.6.0"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Create temporary kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: car-repair-shop

      - name: Prepare CI Terraform variables
        working-directory: .
        run: |
          SA_PASSWORD="${{ secrets.CI_SA_PASSWORD }}"
          JWT_SECRET_KEY="${{ secrets.CI_JWT_SECRET_KEY }}"

          if [ -z "$SA_PASSWORD" ]; then
            generate_sa_password() {
              UPPER="$(tr -dc 'A-Z' < /dev/urandom | head -c 6)"
              LOWER="$(tr -dc 'a-z' < /dev/urandom | head -c 6)"
              DIGIT="$(tr -dc '0-9' < /dev/urandom | head -c 4)"
              SPECIAL="$(
                printf '%s\n' '!' '@' '#' '%' '^' '&' '*' '_' '+' '-' '=' |
                  shuf |
                  head -n 4 |
                  tr -d '\n'
              )"
              EXTRA="$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 4)"
              SA_PASSWORD="$(
                printf '%s%s%s%s%s' "$UPPER" "$LOWER" "$DIGIT" "$SPECIAL" "$EXTRA" |
                  fold -w1 |
                  shuf |
                  tr -d '\n'
              )"
            }

            generate_sa_password
            while ! (
              [ "${#SA_PASSWORD}" -ge 8 ] &&
              printf '%s' "$SA_PASSWORD" | grep -q '[A-Z]' &&
              printf '%s' "$SA_PASSWORD" | grep -q '[a-z]' &&
              printf '%s' "$SA_PASSWORD" | grep -q '[0-9]' &&
              printf '%s' "$SA_PASSWORD" | grep -q '[!@#%^&*_=+-]'
            ); do
              generate_sa_password
            done
          fi

          if [ -z "$JWT_SECRET_KEY" ]; then
            JWT_SECRET_KEY="$(openssl rand -hex 32)"
          fi

          echo "TF_VAR_sa_password=$SA_PASSWORD" >> "$GITHUB_ENV"
          echo "TF_VAR_jwt_secret_key=$JWT_SECRET_KEY" >> "$GITHUB_ENV"
          echo "TF_VAR_api_image=car-repair-shop-api:ci" >> "$GITHUB_ENV"
          echo "TF_VAR_use_existing_cluster=true" >> "$GITHUB_ENV"

      - name: Build API Docker image
        working-directory: .
        run: docker build -t car-repair-shop-api:ci .

      - name: Load API image into kind
        working-directory: .
        run: kind load docker-image car-repair-shop-api:ci --name car-repair-shop

      - name: Show cluster info
        working-directory: .
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Verify resources after apply
        working-directory: .
        run: kubectl get all -n car-repair-shop

      - name: Terraform Destroy
        if: always()
        run: |
          if [ ! -d ".terraform" ]; then
            echo "Skipping destroy because Terraform was not initialized."
            exit 0
          fi

          terraform destroy -auto-approve

      - name: Delete kind cluster
        if: always()
        working-directory: .
        run: kind delete cluster --name car-repair-shop
