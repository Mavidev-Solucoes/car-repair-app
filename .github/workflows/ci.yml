name: CI - Aplicação

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore API
        run: |
          dotnet restore \
            src/CarRepairShop.API/CarRepairShop.API.csproj

      - name: Build API
        run: |
          dotnet build \
            src/CarRepairShop.API/CarRepairShop.API.csproj \
            --configuration Release \
            --no-restore

      - name: Unit Tests
        run: |
          dotnet test \
            tests/CarRepairShop.UnitTests/CarRepairShop.UnitTests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=unit-tests.trx" \
            --results-directory ./TestResults \
            --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Upload Unit Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: TestResults/

  integration-tests:
    name: Integration Tests PostgreSQL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Integration Tests
        run: |
          dotnet test \
            tests/CarRepairShop.IntegrationTests/CarRepairShop.IntegrationTests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=integration-tests.trx" \
            --results-directory ./TestResults \
            -- xunit.parallelizeAssembly=false

      - name: Upload Integration Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: TestResults/

  manifests:
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Render Dev
        run: |
          kubectl kustomize k8s/overlays/dev \
            > /tmp/car-repair-dev.yaml

      - name: Render Prod
        run: |
          kubectl kustomize k8s/overlays/prod \
            > /tmp/car-repair-prod.yaml

      - name: Render Academy Gateway
        run: |
          kubectl kustomize k8s/overlays/academy-dev/gateway \
            > /tmp/car-repair-academy-gateway.yaml

      - name: Validate Academy does not require External Secrets
        run: |
          if grep -q '^kind: ExternalSecret$' \
            /tmp/car-repair-academy-gateway.yaml; then
            echo "Academy overlay não pode conter ExternalSecret."
            exit 1
          fi

  container:
    name: Docker Image Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Container
        run: |
          docker build \
            -t car-repair-app:ci \
            .
