  # ─── Deploy via kubectl ───────────────────────────────────────────────────────
  # Applies all Kubernetes manifests from the k8s/ directory to the cluster.
  # Uses KUBECONFIG secret to authenticate. Patches the API deployment image
  # with the freshly built tag before applying.
  # Runs only on pushes to main.
  deploy-kubectl:
    name: Deploy via kubectl (k8s/)
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Patch deployment image
        run: |
          sed -i "s|image: .*car-repair-shop.*|image: ${{ needs.docker-build.outputs.image }}:${{ needs.docker-build.outputs.tag }}|" k8s/api-deployment.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/mssql-statefulset.yaml
          kubectl apply -f k8s/mssql-service.yaml
          kubectl apply -f k8s/api-deployment.yaml
          kubectl apply -f k8s/api-service.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Wait for API rollout
        run: |
          kubectl rollout status deployment/car-repair-shop-api \
            -n car-repair-shop \
            --timeout=180s

