services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "CarRepairShop@2024!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CarRepairShop@2024!' -Q 'SELECT 1' -No",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Server=db;Database=CarRepairShopDb;User Id=sa;Password=CarRepairShop@2024!;TrustServerCertificate=True;"
      JwtSettings__SecretKey: "CarRepairShopSuperSecretKeyWithAtLeast32Chars!"
      JwtSettings__Issuer: "CarRepairShop"
      JwtSettings__Audience: "CarRepairShop"
      JwtSettings__ExpirationMinutes: "60"
    depends_on:
      db:
        condition: service_healthy

volumes:
  sqldata:
