# IMPORTANT: Replace all placeholder values below with real credentials before applying.
# Never commit real secrets to version control.
#
# To base64-encode a value manually:
#   echo -n 'MyValue' | base64
#
# Using stringData (plain text) is equivalent and Kubernetes encodes it automatically.
apiVersion: v1
kind: Secret
metadata:
  name: car-repair-shop-secrets
  namespace: car-repair-shop
type: Opaque
stringData:
  # SQL Server SA password — must meet SQL Server complexity requirements
  # (min 8 chars, upper, lower, digit and special character)
  SA_PASSWORD: "YourStrongPassword@2024!"

  # JWT secret key — minimum 32 characters
  JWT_SECRET_KEY: "YourSuperSecretKeyWithAtLeast32Chars!"

  # Connection string for the API — Password must match SA_PASSWORD above
  ConnectionStrings__DefaultConnection: "Server=mssql;Database=CarRepairShopDb;User Id=sa;******;TrustServerCertificate=True;"

  # SMTP credentials
  SmtpSettings__Username: "your-smtp-username@example.com"
  SmtpSettings__Password: "your-smtp-password"

