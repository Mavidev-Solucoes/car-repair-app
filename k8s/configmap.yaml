apiVersion: v1
kind: ConfigMap
metadata:
  name: car-repair-shop-config
  namespace: car-repair-shop
data:
  # ASP.NET Core
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_HTTP_PORTS: "8080"

  # JWT (non-sensitive fields only; SecretKey lives in the Secret)
  JwtSettings__Issuer: "CarRepairShop"
  JwtSettings__Audience: "CarRepairShop"
  JwtSettings__ExpirationMinutes: "60"

  # Application
  AppSettings__BaseUrl: "https://api.car-repair-shop.example.com"

  # SMTP (non-sensitive fields; credentials live in the Secret)
  SmtpSettings__Host: "smtp.example.com"
  SmtpSettings__Port: "465"
  SmtpSettings__UseSsl: "true"
  SmtpSettings__FromEmail: "no-reply@car-repair-shop.example.com"
  SmtpSettings__FromName: "Car Repair Shop"

  # SQL Server (used by the mssql StatefulSet)
  ACCEPT_EULA: "Y"
  MSSQL_PID: "Developer"
