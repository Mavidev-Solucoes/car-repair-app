apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: car-repair-app-swagger
  namespace: car-repair-app
  annotations:
    konghq.com/strip-path: "false"
spec:
  ingressClassName: kong
  rules:
    - http:
        paths:
          - path: /swagger
            pathType: Prefix
            backend:
              service:
                name: car-repair-app
                port:
                  number: 80
