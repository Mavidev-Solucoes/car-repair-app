apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: car-repair-app-secrets
spec:
  data:
    - secretKey: db_username
      remoteRef:
        key: car-repair/hml/database
        property: username
    - secretKey: db_password
      remoteRef:
        key: car-repair/hml/database
        property: password
    - secretKey: db_host
      remoteRef:
        key: car-repair/hml/database
        property: host
    - secretKey: db_port
      remoteRef:
        key: car-repair/hml/database
        property: port
    - secretKey: db_name
      remoteRef:
        key: car-repair/hml/database
        property: database
    - secretKey: jwt_secret_key
      remoteRef:
        key: car-repair/hml/jwt
        property: secretKey
    - secretKey: newrelic_license_key
      remoteRef:
        key: car-repair/hml/newrelic
        property: licenseKey
    - secretKey: smtp_username
      remoteRef:
        key: car-repair/hml/smtp
        property: username
    - secretKey: smtp_password
      remoteRef:
        key: car-repair/hml/smtp
        property: password
