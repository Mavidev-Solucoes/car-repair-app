apiVersion: v1
kind: ConfigMap
metadata:
  name: car-repair-app-config
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_HTTP_PORTS: "8080"
  CORECLR_ENABLE_PROFILING: "1"
  CORECLR_PROFILER: "{36032161-FFC0-4B61-B559-F6C5D41BAE5A}"
  CORECLR_NEWRELIC_HOME: "/usr/local/newrelic-dotnet-agent"
  CORECLR_PROFILER_PATH: "/usr/local/newrelic-dotnet-agent/libNewRelicProfiler.so"
  NEW_RELIC_APP_NAME: "car-repair-app"
  NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
  NEW_RELIC_LOG_CONSOLE: "true"
  NEW_RELIC_ATTRIBUTES_ENABLED: "true"
  NEW_RELIC_LABELS: "project:car-repair-shop;environment:base"
  JwtSettings__Issuer: "car-repair-auth"
  JwtSettings__Audience: "car-repair-shop"
  JwtSettings__ExpirationMinutes: "60"
  Database__RunMigrationsOnStartup: "false"
  AuthLambda__BaseUrl: "https://replace-with-auth-gateway.example.com"
  AuthLambda__TokenPath: "/auth/token"
  SmtpSettings__Host: "replace-with-smtp-host"
  SmtpSettings__Port: "465"
  SmtpSettings__UseSsl: "true"
  SmtpSettings__FromEmail: "no-reply@car-repair.local"
  SmtpSettings__FromName: "Car Repair Shop"
  AppSettings__BaseUrl: "https://car-repair.local"
