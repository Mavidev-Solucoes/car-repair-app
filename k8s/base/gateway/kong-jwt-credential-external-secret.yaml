apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kong-jwt-credential-car-repair-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: car-repair-app-secretsmanager
    kind: SecretStore
  target:
    name: kong-jwt-credential-car-repair-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      metadata:
        labels:
          konghq.com/credential: jwt
      data:
        key: car-repair-auth
        algorithm: HS256
        secret: "{{ .jwt_secret_key }}"
  data:
    - secretKey: jwt_secret_key
      remoteRef:
        key: car-repair/dev/jwt
        property: secretKey
