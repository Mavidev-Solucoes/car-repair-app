apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: car-repair-jwt
plugin: jwt
config:
  key_claim_name: iss
  claims_to_verify:
    - exp
  run_on_preflight: false
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: car-repair-correlation-id
plugin: correlation-id
config:
  header_name: X-Correlation-ID
  generator: uuid
  echo_downstream: true
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: car-repair-auth-rate-limit
plugin: rate-limiting
config:
  minute: 5
  policy: local
  fault_tolerant: true
  hide_client_headers: false
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: car-repair-api-rate-limit
plugin: rate-limiting
config:
  minute: 100
  policy: local
  fault_tolerant: true
  hide_client_headers: false
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: car-repair-cors
plugin: cors
config:
  origins:
    - http://localhost:3000
  methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  headers:
    - Authorization
    - Content-Type
    - X-Correlation-ID
  exposed_headers:
    - X-Correlation-ID
  credentials: false
  max_age: 3600
  preflight_continue: false
